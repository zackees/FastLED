name: cleanup-artifacts

on:
  release:
    types: [released]
  # Allow manual triggering for testing/emergency cleanup
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    
    steps:
      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          # Delete all artifacts older than 30 days (keep some history)
          name: '*'
          failOnError: false
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep artifacts for 30 days to preserve some release history
          retentionDays: 30

      - name: Log cleanup completion
        run: |
          echo "Release-triggered artifact cleanup completed successfully"
          echo "Old GitHub Actions artifacts have been cleaned up for release: ${{ github.event.release.tag_name }}"