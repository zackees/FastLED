name: docs-pages-native

# This is an alternative implementation using GitHub's native Pages actions
# It can be used as a replacement for docs.yml for better artifact management
# Currently disabled - rename to docs.yml to activate and disable the original

on:
  release:
    types: released
  # Allow manual triggering for testing
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Repository Reference Info
        id: repo-info
        run: |
          git fetch --prune --unshallow --tags
          RELEASE_TAG=${{ github.event.release.tag_name }}
          LATEST_TAG=$(git tag | grep -E '^[0-9]' | sort -V | tail -1)
          GIT_SHA_SHORT=$(sed 's/\(.\{7\}\).*/\1/' <<< "$GITHUB_SHA")
          PROJECT_NUMBER=${RELEASE_TAG:-${LATEST_TAG:-$GIT_SHA_SHORT}}
          COMMIT_MSG=$PROJECT_NUMBER
          if [ "$PROJECT_NUMBER" != "$GIT_SHA_SHORT" ]; then COMMIT_MSG+=" ($GITHUB_SHA)"; fi
          echo "The project number is \"$PROJECT_NUMBER\" and the commit message is \"$COMMIT_MSG\""
          echo "project-number=$PROJECT_NUMBER" >> $GITHUB_OUTPUT
          echo "commit-message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Install Doxygen
        env: 
          DOXYGEN_VERSION: 1.11.0
        run: |
          wget -q https://www.doxygen.nl/files/doxygen-${{ env.DOXYGEN_VERSION }}.linux.bin.tar.gz
          tar -xf doxygen-${{ env.DOXYGEN_VERSION }}.linux.bin.tar.gz
          cd doxygen-${{ env.DOXYGEN_VERSION }} && sudo make install

      - name: Install Themes
        env:
          DOXYGEN_AWESOME_VERSION: 2.3.3
        working-directory: ./docs
        run: |
          git clone --depth 1 -b v${{ env.DOXYGEN_AWESOME_VERSION }} https://github.com/jothepro/doxygen-awesome-css

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Generate Docs
        working-directory: ./docs
        run: |
          sed -i -E 's/(PROJECT_NUMBER\s*=\s*).*/\1 ${{ steps.repo-info.outputs.project-number }}/g' Doxyfile
          doxygen Doxyfile

      - name: Cleanup and optimize generated docs
        run: |
          # Remove any temporary files or git directories
          rm -rf ./docs/html/.git || true
          find ./docs/html -name "*.tmp" -delete || true
          find ./docs/html -name ".DS_Store" -delete || true
          find ./docs -name "*.bak" -delete || true
          # Optimize file sizes
          find ./docs/html -name "*.html" -exec gzip -k {} \; || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/html

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4